<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ugurugu engine worker harness</title>
</head>
<body>
<h1>Ugurugu engine worker harness</h1>
<pre id="result">loading…</pre>
<script>
const result = document.getElementById("result");
const worker = new Worker("engine-worker.js");
worker.onmessage = (event) => {
    result.textContent = JSON.stringify(event.data, null, 2);
    result.dataset.state = event.data.ok ? "ok" : "failed";
};
worker.onerror = (event) => {
    result.textContent = "worker error: " + event.message;
    result.dataset.state = "failed";
};
fetch("Wave.ugu")
    .then((response) => response.arrayBuffer())
    .then((buffer) => worker.postMessage(buffer, [buffer]))
    .catch((error) => {
        result.textContent = "fetch error: " + error;
        result.dataset.state = "failed";
    });
</script>
</body>
</html>
