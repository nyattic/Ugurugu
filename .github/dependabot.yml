version: 2

# C++ dependencies are pinned by URL and SHA-256 in
# cmake/UguruguDependencies.cmake, which Dependabot cannot read. Qt, spdlog,
# libwebp, Sparkle and Velopack have to be bumped by hand.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web-dev-dependencies:
        dependency-type: development
        patterns:
          - '*'
