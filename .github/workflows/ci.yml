name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.11.1
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
  QT_FORCE_STDERR_LOGGING: 1

jobs:
  static:
    name: Format and release metadata
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Check source formatting
        run: >-
          git ls-files -z -- '*.cpp' '*.hpp' '*.mm' |
          xargs -0 xcrun clang-format --dry-run --Werror

      - name: Test download badge aggregation
        run: node --test .github/scripts/update-download-badge.test.js

      - name: Check release metadata
        shell: bash
        run: |
          version=$(sed -nE 's/project\(WagleWaglePaint VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid project version: $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi
          for language in ko en ja; do
            notes="release-notes/$version.$language.md"
            if [[ ! -s "$notes" ]] || ! grep -q '[^[:space:]]' "$notes"; then
              echo "Missing or empty release notes: $notes"
              exit 1
            fi
          done
          shopt -s nullglob
          notes=(release-notes/"$version".*.md)
          if [[ ${#notes[@]} -ne 3 ]]; then
            echo "Expected exactly ko, en, and ja release notes for version $version"
            printf 'Found: %s\n' "${notes[@]}"
            exit 1
          fi

  translations:
    name: Translations
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '${{ env.QT_VERSION }}'
          aqtsource: '${{ env.AQT_SOURCE }}'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Check translation completeness
        run: |
          translation_dir="$RUNNER_TEMP/translations"
          mkdir -p "$translation_dir"
          cp i18n/wobblepaint_ko.ts i18n/wobblepaint_ja.ts "$translation_dir/"
          "$QT_ROOT_DIR/bin/lupdate" \
            src \
            -extensions cpp,hpp,mm \
            -no-obsolete \
            -warnings-are-errors \
            -ts \
            "$translation_dir/wobblepaint_ko.ts" \
            "$translation_dir/wobblepaint_ja.ts"
          if grep -n 'type="unfinished"' "$translation_dir"/*.ts; then
            echo "Translations contain unfinished entries"
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Debug
            os: macos-15
            preset: macos-debug
            qt-host: mac
            qt-arch: clang_64
          - name: macOS Release
            os: macos-15
            preset: macos-release
            qt-host: mac
            qt-arch: clang_64
          - name: Windows Debug
            os: windows-2025
            preset: windows-debug
            qt-host: windows
            qt-arch: win64_msvc2022_64
          - name: Windows Release
            os: windows-2025
            preset: windows-release
            qt-host: windows
            qt-arch: win64_msvc2022_64
          - name: macOS ASan + UBSan
            os: macos-15
            preset: macos-sanitized
            qt-host: mac
            qt-arch: clang_64
          - name: macOS Coverage
            os: macos-15
            preset: macos-coverage
            qt-host: mac
            qt-arch: clang_64
            coverage: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '${{ env.QT_VERSION }}'
          aqtsource: '${{ env.AQT_SOURCE }}'
          host: '${{ matrix.qt-host }}'
          target: desktop
          arch: '${{ matrix.qt-arch }}'
          cache: true

      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DWOBBLEPAINT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Prepare coverage profiles
        if: matrix.coverage
        run: mkdir -p "out/build/${{ matrix.preset }}/profiles"

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 7 --output-on-failure

      - name: Check source coverage
        if: matrix.coverage
        run: |
          profile="out/build/${{ matrix.preset }}/coverage.profdata"
          xcrun llvm-profdata merge \
            -sparse \
            "out/build/${{ matrix.preset }}"/profiles/*.profraw \
            -o "$profile"
          coverage_report=$(xcrun llvm-cov report \
            "out/build/${{ matrix.preset }}/wobblepaint_tests" \
            -instr-profile="$profile" \
            -ignore-filename-regex='(/tests/|/_deps/|/out/)')
          printf '%s\n' "$coverage_report"
          line_coverage=$(printf '%s\n' "$coverage_report" | awk '/^TOTAL/ { value=$10; gsub("%", "", value); print value }')
          awk -v coverage="$line_coverage" 'BEGIN { exit !(coverage + 0 >= 70.0) }'

      - name: Test diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content "out/build/${{ matrix.preset }}/Testing/Temporary/LastTest.log" -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $testExecutable = Get-ChildItem `
            "out/build/${{ matrix.preset }}" `
            -Recurse `
            -Filter wobblepaint_tests.exe |
            Select-Object -First 1
          if ($testExecutable) {
            & $testExecutable.FullName 2>&1
            "direct run exit code: $LASTEXITCODE"
          }

  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS package
            os: macos-15
            preset: macos-distribution
            qt-host: mac
            qt-arch: clang_64
            smoke: macos
          - name: Windows package
            os: windows-2025
            preset: windows-distribution
            qt-host: windows
            qt-arch: win64_msvc2022_64
            smoke: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '${{ env.QT_VERSION }}'
          aqtsource: '${{ env.AQT_SOURCE }}'
          host: '${{ matrix.qt-host }}'
          target: desktop
          arch: '${{ matrix.qt-arch }}'
          cache: true

      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DWOBBLEPAINT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 7 --output-on-failure

      - name: Test installed macOS package
        if: matrix.smoke == 'macos'
        run: >-
          cmake --build --preset ${{ matrix.preset }}
          --target wobblepaint_package_smoke_test

      - name: Test installed Windows application
        if: matrix.smoke == 'windows'
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "WagleWaglePaint"
          cmake --install "out/build/${{ matrix.preset }}" `
            --config Release `
            --prefix $installRoot
          $env:QT_QPA_PLATFORM = "offscreen"
          $application = Join-Path $installRoot "WagleWaglePaint.exe"
          $process = Start-Process $application -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Installed application exited with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - name: Test diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content "out/build/${{ matrix.preset }}/Testing/Temporary/LastTest.log" -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $testExecutable = Get-ChildItem `
            "out/build/${{ matrix.preset }}" `
            -Recurse `
            -Filter wobblepaint_tests.exe |
            Select-Object -First 1
          if ($testExecutable) {
            & $testExecutable.FullName 2>&1
            "direct run exit code: $LASTEXITCODE"
          }

  quality:
    name: Quality gate
    if: always()
    needs: [static, translations, build, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality check
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TRANSLATIONS_RESULT: ${{ needs.translations.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          failed=0
          for check in STATIC TRANSLATIONS BUILD PACKAGE; do
            result_variable="${check}_RESULT"
            result="${!result_variable}"
            if [[ "$result" != "success" ]]; then
              echo "$check result: $result"
              failed=1
            fi
          done
          exit "$failed"
