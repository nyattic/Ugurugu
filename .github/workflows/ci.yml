name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.10.3
  QT_FORCE_STDERR_LOGGING: 1

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            preset: macos-debug
            qt-host: mac
            qt-arch: clang_64
          - name: Windows
            os: windows-2022
            preset: windows-debug
            qt-host: windows
            qt-arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '${{ env.QT_VERSION }}'
          host: '${{ matrix.qt-host }}'
          target: desktop
          arch: '${{ matrix.qt-arch }}'
          cache: true

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Test diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content out/build/windows-debug/Testing/Temporary/LastTest.log -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          & out\build\windows-debug\Debug\wobblepaint_tests.exe 2>&1
          "direct run exit code: $LASTEXITCODE"
