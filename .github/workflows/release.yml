name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: 6.10.3
  VELOPACK_VERSION: 1.2.0

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install dependencies
        run: brew install cmake ninja qt spdlog fmt

      - name: Configure
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix spdlog);$(brew --prefix fmt)"
          cmake --preset macos-release

      - name: Build
        run: cmake --build --preset macos-release --parallel

      - name: Install
        run: cmake --install out/build/macos-release --prefix "$RUNNER_TEMP/install"

      - name: Package DMG and Sparkle update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          version=$(sed -nE 's/project\(WagleWaglePaint VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          architecture=$(uname -m)
          release_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            release_tag="v${version}"
          fi
          mkdir -p artifacts "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/sparkle-updates"
          cp -R "$RUNNER_TEMP/install/WagleWaglePaint.app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create \
            -volname WagleWaglePaint \
            -srcfolder "$RUNNER_TEMP/dmg" \
            -format UDZO \
            -ov \
            "artifacts/WagleWaglePaint-${version}-macOS-${architecture}.dmg"
          archive="WagleWaglePaint-${version}-macOS-${architecture}.zip"
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$RUNNER_TEMP/install/WagleWaglePaint.app" \
            "$RUNNER_TEMP/sparkle-updates/$archive"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            out/build/macos-release/_deps/sparkle-src/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/nyattic/WagleWaglePaint/releases/download/${release_tag}/" \
              --link "https://github.com/nyattic/WagleWaglePaint" \
              --maximum-versions 1 \
              --maximum-deltas 0 \
              "$RUNNER_TEMP/sparkle-updates"
          cp "$RUNNER_TEMP/sparkle-updates/$archive" artifacts/
          cp "$RUNNER_TEMP/sparkle-updates/appcast.xml" artifacts/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-release
          path: artifacts/*
          if-no-files-found: error

  windows:
    name: Build Windows release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '${{ env.QT_VERSION }}'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install spdlog:x64-windows fmt:x64-windows
          dotnet tool install --global vpk --version $env:VELOPACK_VERSION

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-release `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows"

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-release --config Release --parallel

      - name: Install
        shell: pwsh
        run: |
          cmake --install out/build/windows-release `
            --config Release `
            --prefix "$env:RUNNER_TEMP\WagleWaglePaint"

      - name: Package with Velopack
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(WagleWaglePaint VERSION ([0-9.]+)') {
            throw "Could not determine application version"
          }
          $version = $Matches[1]
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          vpk pack `
            --packId WagleWaglePaint `
            --packVersion $version `
            --packDir "$env:RUNNER_TEMP\WagleWaglePaint" `
            --mainExe WagleWaglePaint.exe `
            --packTitle WagleWaglePaint `
            --packAuthors nyattic `
            --icon resources/icons/WobblePaint.ico `
            --runtime win10-x64 `
            --channel win `
            --delta None `
            --noPortable true `
            --outputDir artifacts
          Rename-Item `
            -Path "artifacts\WagleWaglePaint-win-Setup.exe" `
            -NewName "WagleWaglePaint-${version}-Windows-x64-Setup.exe"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-release
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          generate_release_notes: true
          files: artifacts/*
