name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: 6.10.3
  VELOPACK_VERSION: 1.2.0

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '${{ env.QT_VERSION }}'
          host: mac
          target: desktop
          cache: true

      - name: Configure
        run: cmake --preset macos-release "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"

      - name: Build
        run: cmake --build --preset macos-release --parallel

      - name: Test
        run: ctest --preset macos-release

      - name: Install
        run: cmake --install out/build/macos-release --prefix "$RUNNER_TEMP/install"

      - name: Verify installed package
        run: |
          application="$RUNNER_TEMP/install/WagleWaglePaint.app"
          smoke_root="$RUNNER_TEMP/package-smoke"
          mkdir -p "$smoke_root/MacOS"
          ln -s "$application/Contents/Frameworks" "$smoke_root/Frameworks"
          cp \
            out/build/macos-release/wobblepaint_package_smoke \
            "$smoke_root/MacOS/"
          "$smoke_root/MacOS/wobblepaint_package_smoke" "$application"
          codesign --verify --deep --strict "$application"

      - name: Package DMG and prepare Sparkle update
        id: package
        run: |
          version=$(sed -nE 's/project\(WagleWaglePaint VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          architecture=$(uname -m)
          release_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${release_tag}" != "v${version}" ]]; then
            echo "Release tag ${release_tag} does not match project version ${version}"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            release_tag="v${version}"
          fi
          for language in ko en ja; do
            if [[ ! -f "release-notes/${version}.${language}.md" ]]; then
              echo "Missing release notes: release-notes/${version}.${language}.md"
              exit 1
            fi
          done
          mkdir -p artifacts "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/sparkle-updates"
          cp -R "$RUNNER_TEMP/install/WagleWaglePaint.app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create \
            -volname WagleWaglePaint \
            -srcfolder "$RUNNER_TEMP/dmg" \
            -format UDZO \
            -ov \
            "artifacts/WagleWaglePaint-macOS-${architecture}.dmg"
          archive="WagleWaglePaint-macOS-${architecture}.zip"
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$RUNNER_TEMP/install/WagleWaglePaint.app" \
            "$RUNNER_TEMP/sparkle-updates/$archive"
          out/build/macos-release/wobblepaint_render_release_notes \
            "release-notes/${version}.en.md" \
            "$RUNNER_TEMP/sparkle-updates/${archive%.zip}.html"
          out/build/macos-release/wobblepaint_render_release_notes \
            "release-notes/${version}.ko.md" \
            "$RUNNER_TEMP/sparkle-updates/${archive%.zip}.ko.html"
          out/build/macos-release/wobblepaint_render_release_notes \
            "release-notes/${version}.ja.md" \
            "$RUNNER_TEMP/sparkle-updates/${archive%.zip}.ja.html"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Sign Sparkle update and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "SPARKLE_PRIVATE_KEY is not configured"
            exit 1
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            out/build/macos-release/_deps/sparkle-src/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/nyattic/WagleWaglePaint/releases/download/${RELEASE_TAG}/" \
              --release-notes-url-prefix "https://github.com/nyattic/WagleWaglePaint/releases/download/${RELEASE_TAG}/" \
              --link "https://github.com/nyattic/WagleWaglePaint" \
              --embed-release-notes \
              --maximum-versions 1 \
              --maximum-deltas 0 \
              "$RUNNER_TEMP/sparkle-updates"
          cp "$RUNNER_TEMP/sparkle-updates/$ARCHIVE" artifacts/
          cp "$RUNNER_TEMP/sparkle-updates/appcast.xml" artifacts/
          cp "$RUNNER_TEMP/sparkle-updates/${ARCHIVE%.zip}.ko.html" artifacts/
          cp "$RUNNER_TEMP/sparkle-updates/${ARCHIVE%.zip}.ja.html" artifacts/

      - name: Verify macOS compatibility
        run: |
          application="$RUNNER_TEMP/install/WagleWaglePaint.app"
          failed=0
          declared=$(plutil -extract LSMinimumSystemVersion raw -o - "$application/Contents/Info.plist")
          if [[ "$declared" != "14.0" ]]; then
            echo "Info.plist declares macOS $declared"
            failed=1
          fi
          while IFS= read -r binary; do
            if ! file "$binary" | grep -q "Mach-O"; then
              continue
            fi
            while IFS= read -r minimum; do
              major="${minimum%%.*}"
              remainder="${minimum#*.}"
              minor="${remainder%%.*}"
              if [[ -n "$major" && ( "$major" -gt 14 || ( "$major" -eq 14 && "$minor" -gt 0 ) ) ]]; then
                echo "$binary requires macOS $minimum"
                failed=1
              fi
            done < <(otool -l "$binary" | awk '$1 == "minos" { print $2 }')
            while IFS= read -r dependency; do
              case "$dependency" in
                @rpath/*|@loader_path/*|@executable_path/*|/System/Library/*|/usr/lib/*)
                  ;;
                *)
                  echo "$binary contains external runtime dependency $dependency"
                  failed=1
                  ;;
              esac
            done < <(
              dyld_info -dependents "$binary" | awk '
                /\[[^]]+\]:$/ { linked = 0 }
                $1 == "-linked_dylibs:" { linked = 1; next }
                $1 == "-rpaths:" { linked = 0 }
                linked && $1 != "attributes" { print $NF }
              '
            )
            while IFS= read -r rpath; do
              case "$rpath" in
                @loader_path/*|@executable_path/*)
                  ;;
                *)
                  echo "$binary contains non-portable runtime search path $rpath"
                  failed=1
                  ;;
              esac
            done < <(
              otool -l "$binary" | awk '
                $1 == "cmd" && $2 == "LC_RPATH" { rpath = 1; next }
                rpath && $1 == "path" { print $2; rpath = 0 }
              '
            )
          done < <(find "$application" -type f)
          exit "$failed"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-release
          path: artifacts/*
          if-no-files-found: error

  windows:
    name: Build Windows release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '${{ env.QT_VERSION }}'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install Velopack
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version $env:VELOPACK_VERSION

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-release `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-release --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --preset windows-release

      - name: Install
        shell: pwsh
        run: |
          cmake --install out/build/windows-release `
            --config Release `
            --prefix "$env:RUNNER_TEMP\WagleWaglePaint"

      - name: Package with Velopack
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(WagleWaglePaint VERSION ([0-9.]+)') {
            throw "Could not determine application version"
          }
          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match project version $version"
          }
          $releaseNotes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $sections = foreach ($language in @('ko', 'en', 'ja')) {
            $file = "release-notes/$version.$language.md"
            if (-not (Test-Path $file)) {
              throw "Missing release notes: $file"
            }
            "<!-- lang:$language -->"
            Get-Content $file -Raw
          }
          Set-Content -Path $releaseNotes -Value ($sections -join "`n")
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          vpk pack `
            --packId WagleWaglePaint `
            --packVersion $version `
            --packDir "$env:RUNNER_TEMP\WagleWaglePaint" `
            --mainExe WagleWaglePaint.exe `
            --packTitle WagleWaglePaint `
            --packAuthors nyattic `
            --icon resources/icons/WobblePaint.ico `
            --releaseNotes $releaseNotes `
            --runtime win10-x64 `
            --channel win `
            --delta None `
            --noPortable true `
            --outputDir artifacts
          Rename-Item `
            -Path "artifacts\WagleWaglePaint-win-Setup.exe" `
            -NewName "WagleWaglePaint-Windows-x64-Setup.exe"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-release
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            cat "release-notes/${version}.ko.md"
            echo
            echo "<details><summary>English</summary>"
            echo
            cat "release-notes/${version}.en.md"
            echo
            echo "</details>"
            echo
            echo "<details><summary>日本語</summary>"
            echo
            cat "release-notes/${version}.ja.md"
            echo
            echo "</details>"
          } > "$RUNNER_TEMP/release-body.md"
          echo "path=$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          name: WagleWaglePaint ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: artifacts/*
